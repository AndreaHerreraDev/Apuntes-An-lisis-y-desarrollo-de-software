<!doctype html> <!-- codigo base de bootstrap/ siempre que vvaya a crear un html-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <main class=" container border text-center p-2 justify-content-center align-items-center ">
        <h1 class="text-info">Actividad con Bootstrap 5</h1>
        <div class="row p-4">
            <div class="border col-6 border-dark">
                <h1 class="text-success">Columna 1</h1>
                <p>Esta es la primera columna.Contiene texto con un borde y padding. </p>
            </div>

            <div class="border col-6 border border-danger">
                <h1 class="text-danger">Columna 2</h1>
                <p>Esta es la segunda columna.Contiene texto con un borde y padding. </p>
            </div>
            <!-- Imagen de usuario -->
            <div class="text-center p-4">
                <img style="width: 300px" src="https://avatars.githubusercontent.com/u/242640416?v=4" alt="Usuario"
                    class="rounded-circle">

            </div>
            <div class="row justify-content-center">
                <button class="btn bg-info col-2">Haz clíc aquí</button>
            </div>
            <div class="row text-start"><h1 class="  p-2 text-info ">Tabla de datos</h1>    
</div>

         <table class="table  table-hover">
                <thead>
                    <tr class="table-dark"> 
            
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Ana</td>
                        <td>25</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Juan</td>
                        <td>30</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Maria</td>
                        <td>22</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

        crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>



</body>

</html>
